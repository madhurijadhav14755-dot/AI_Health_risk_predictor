{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Prediction</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: white;
            margin: 0;
            padding: 30px;
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        form{
            max-width:400px;
            margin:auto;
        }

        input, select{
            width:100%;
            padding:10px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            background:#2d7ef7;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#1f66d1;
        }
    </style>
</head>
<body>

<h2>Health Prediction</h2>

<form method="POST">
    {% csrf_token %}

    <input type="number" name="age" placeholder="Age" required>

    <select name="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
    </select>

    <input type="number" name="height" placeholder="Height (cm)" required>
    <input type="number" name="weight" placeholder="Weight (kg)" required>
    <select name="blood_pressure" required>
    <option value="">Select Blood Pressure</option>
    <option value="Normal">Normal</option>
    <option value="High">High</option>
</select>
    <input type="number" name="sugar_level" placeholder="Blood Sugar" required>
    <input type="number" name="heart_rate" placeholder="Heart Rate" required>

    <button type="submit">
        Predict
    </button>
</form>

</body>
</html>
