{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="form-section">

    <div class="form-container fade-in">

        <h2>Health Register</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="msg {{ message.tags }}">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <input type="text"
                       name="first_name"
                       placeholder="First Name"
                       required>
            </div>

            <div class="form-group">
                <input type="text"
                       name="last_name"
                       placeholder="Last Name"
                       required>
            </div>

            <div class="form-group">
                <input type="text"
                       name="username"
                       placeholder="Username"
                       required>
            </div>

            <div class="form-group">
                <input type="email"
                       name="email"
                       placeholder="Email Address"
                       required>
            </div>

            <div class="form-group">
                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>
            </div>

            <div class="form-group">
                <input type="password"
                       name="confirm_password"
                       placeholder="Confirm Password"
                       required>
            </div>

            <button type="submit">
                Register
            </button>

        </form>

        <div class="form-footer">
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </div>

    </div>

</section>

{% endblock %}
