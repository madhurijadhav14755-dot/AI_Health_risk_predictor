{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-success text-white text-center">
                    <h2>AI Health Risk Prediction Result</h2>
                </div>

                <div class="card-body text-center p-5">

                    <h4>Your Health Risk</h4>

                    <h1 class="text-danger fw-bold mt-3">
                        {{ result }}
                    </h1>

                    <p class="mt-4 text-muted">
                        This prediction is generated based on the health information you entered.
                    </p>

                    <div class="mt-4">
                        <a href="{% url 'prediction' %}" class="btn btn-success me-2">
                            Predict Again
                        </a>

                        <a href="{% url 'home' %}" class="btn btn-secondary">
                            Back to Dashboard
                        </a>

                        <a href="{% url 'logout' %}" class="btn btn-danger ms-2">
                            Logout
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
