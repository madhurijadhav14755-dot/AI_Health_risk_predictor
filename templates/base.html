{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Health Risk Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">

    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
            <img src="{% static 'images/logo.jpg' %}" alt="Logo" width="40" height="40" class="me-2">
            <b>AI Health Risk Predictor</b>
        </a>

        <div class="ms-auto">

            <a href="{% url 'home' %}" class="btn btn-outline-light me-2">
                Home
            </a>

            {% if user.is_authenticated %}

                <a href="{% url 'prediction' %}" class="btn btn-light me-2">
                    Prediction
                </a>

                <a href="{% url 'logout' %}" class="btn btn-danger">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}" class="btn btn-outline-light me-2">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-warning">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>

{% block content %}
{% endblock %}

<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2026 AI Health Risk Predictor System | Developed using Django & Bootstrap
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
