{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="prediction-section">

    <div class="prediction-box fade-in">

        <h2>Health Prediction</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <input type="number"
                       name="age"
                       placeholder="Age"
                       required>
            </div>

            <div class="form-group">
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <input type="number"
                       name="height"
                       placeholder="Height (cm)"
                       required>
            </div>

            <div class="form-group">
                <input type="number"
                       name="weight"
                       placeholder="Weight (kg)"
                       required>
            </div>

            <div class="form-group">
                <select name="blood_pressure" required>
                    <option value="">Select Blood Pressure</option>
                    <option value="Normal">Normal</option>
                    <option value="High">High</option>
                </select>
            </div>

            <div class="form-group">
                <input type="number"
                       name="sugar_level"
                       placeholder="Blood Sugar"
                       required>
            </div>

            <div class="form-group">
                <input type="number"
                       name="heart_rate"
                       placeholder="Heart Rate"
                       required>
            </div>

            <button type="submit">
                Predict Health Risk
            </button>

        </form>

    </div>

</section>

{% endblock %}
